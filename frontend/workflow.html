<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Visualization | ALPR Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0b0f1a;
        }

        .sidebar {
            background: #111827;
        }

        .card {
            background: #1f2937;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .workflow-container {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .workflow-canvas {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem;
            position: relative;
            overflow-x: auto;
        }

        .workflow-steps {
            display: flex;
            align-items: center;
            gap: 2rem;
            min-width: max-content;
        }

        .workflow-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: all 0.3s ease;
        }

        .step-node {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .step-node.active {
            border-color: #3b82f6;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.4);
            animation: pulse 2s infinite;
        }

        .step-node.completed {
            border-color: #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .step-node.failed {
            border-color: #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .step-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .pending .step-icon {
            color: #64748b;
        }

        .active .step-icon {
            color: #3b82f6;
        }

        .completed .step-icon {
            color: #10b981;
        }

        .failed .step-icon {
            color: #ef4444;
        }

        .step-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-align: center;
            max-width: 120px;
            margin-top: 0.75rem;
            opacity: 0.8;
        }

        .step-status {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }

        .pending .step-status {
            background: #64748b;
        }

        .active .step-status {
            background: #3b82f6;
        }

        .completed .step-status {
            background: #10b981;
        }

        .failed .step-status {
            background: #ef4444;
        }

        .step-connector {
            width: 60px;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .step-connector.active {
            background: linear-gradient(90deg, #3b82f6, transparent);
            animation: flow 1.5s infinite;
        }

        @keyframes flow {
            0% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.3;
            }
        }

        .detail-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .detail-modal.active {
            display: flex;
        }

        .detail-content {
            background: #1e293b;
            border-radius: 24px;
            max-width: 600px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .detail-body {
            padding: 1.5rem;
            max-height: 400px;
            overflow-y: auto;
        }

        .detail-field {
            margin-bottom: 1rem;
        }

        .detail-field label {
            font-size: 0.75rem;
            text-transform: uppercase;
            opacity: 0.6;
            letter-spacing: 0.05em;
        }

        .detail-field value {
            display: block;
            font-size: 1rem;
            margin-top: 0.25rem;
        }
    </style>
</head>

<body class="bg-[#0b0f1a] text-slate-300">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 sidebar flex-shrink-0 flex flex-col border-r border-white/5">
            <div class="p-6">
                <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                    <span class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                        <i class="fas fa-camera text-sm"></i>
                    </span>
                    ALPR Pro
                </h1>
            </div>
            <nav class="flex-1 px-4 space-y-2 mt-4">
                <a href="dashboard.html?view=dashboard" id="nav-dashboard"
                    class="w-full flex items-center gap-3 px-4 py-3 hover:bg-white/5 rounded-xl transition-all">
                    <i class="fas fa-chart-pie"></i>
                    Dashboard
                </a>
                <a href="dashboard.html?view=videos" id="nav-videos"
                    class="w-full flex items-center gap-3 px-4 py-3 hover:bg-white/5 rounded-xl transition-all">
                    <i class="fas fa-video"></i>
                    Videos
                </a>
                <a href="dashboard.html?view=detections" id="nav-detections"
                    class="w-full flex items-center gap-3 px-4 py-3 hover:bg-white/5 rounded-xl transition-all">
                    <i class="fas fa-table"></i>
                    Detections
                </a>
                <a href="dashboard.html?view=monitor" id="nav-monitor"
                    class="w-full flex items-center gap-3 px-4 py-3 hover:bg-white/5 rounded-xl transition-all">
                    <i class="fas fa-server"></i>
                    System Status
                </a>
                <a href="agents.html" id="nav-agents"
                    class="w-full flex items-center gap-3 px-4 py-3 hover:bg-white/5 rounded-xl transition-all">
                    <i class="fas fa-robot"></i>
                    Agent Factory
                </a>
                <a href="workflow.html" id="nav-workflow"
                    class="w-full flex items-center gap-3 px-4 py-3 text-white bg-blue-600/10 rounded-xl border border-blue-500/20">
                    <i class="fas fa-project-diagram"></i>
                    Workflows
                </a>
            </nav>
            <div class="p-4 mt-auto mb-4">
                <button onclick="localStorage.removeItem('token'); window.location.href='auth.html';"
                    class="w-full flex items-center gap-3 px-4 py-3 text-red-400 hover:bg-red-400/10 rounded-xl transition-all">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col min-w-0 overflow-hidden bg-[#0b0f1a]">
            <!-- Header -->
            <header class="h-16 flex items-center justify-between px-8 border-b border-white/5">
                <h2 class="text-lg font-semibold text-white">Workflow Orchestrator</h2>
                <div class="flex items-center gap-4">
                    <span id="user-email" class="text-sm text-slate-400"></span>
                    <div
                        class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold text-white">
                        U</div>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-8">
                <div id="video-selection-view" class="hidden">
                    <h1 class="text-3xl font-bold text-white mb-2">Select Video</h1>
                    <p class="text-slate-400 mb-8">Choose a video to visualize its real-time processing workflow</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="videos-grid">
                        <!-- Videos dynamically loaded -->
                    </div>
                </div>

                <div id="workflow-visualization-view" class="hidden">
                    <div class="flex justify-between items-center mb-8">
                        <div>
                            <h1 class="text-3xl font-bold text-white mb-2">Workflow: <span id="current-video-name"
                                    class="text-blue-500">...</span></h1>
                            <p class="text-slate-400">Live execution trail for Video ID #<span
                                    id="current-video-id">...</span></p>
                        </div>
                        <button onclick="window.location.href='workflow.html'"
                            class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-sm transition-all">
                            <i class="fas fa-arrow-left mr-2"></i> Switch Video
                        </button>
                    </div>

                    <div class="workflow-canvas">
                        <div class="workflow-steps" id="workflowSteps">
                            <!-- Steps rendered dynamically -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Detail Modal -->
    <div class="detail-modal" id="detailModal">
        <div class="detail-content">
            <div class="detail-header">
                <div>
                    <h2 class="text-xl font-bold" id="detailTitle">Step Details</h2>
                    <p class="text-sm text-slate-400 mt-1" id="detailStatus"></p>
                </div>
                <button onclick="closeDetailModal()" class="text-2xl text-slate-400 hover:text-white">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="detail-body" id="detailBody">
                <!-- Details loaded dynamically -->
            </div>
        </div>
    </div>

    <script src="frontend/js/api.js"></script>
    <script>
        // Get video ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('video');

        const STEP_ICONS = {
            'VIDEO_UPLOAD': 'upload', 'CONDITIONING': 'adjust', 'DETECTION': 'car', 'TRACKING': 'route',
            'CAPTURE': 'camera', 'BATCHING': 'th', 'ORCHESTRATOR': 'gavel', 'VALIDATION': 'check-circle',
            'AUDITOR': 'shield-alt', 'COMMIT': 'database'
        };

        const STEP_LABELS = {
            'VIDEO_UPLOAD': 'Video Upload', 'CONDITIONING': 'Conditioning', 'DETECTION': 'Detection',
            'TRACKING': 'Tracking', 'CAPTURE': 'Capture', 'BATCHING': 'Batching',
            'ORCHESTRATOR': 'Orchestrator', 'VALIDATION': 'Validation', 'AUDITOR': 'Auditor', 'COMMIT': 'Commit'
        };

        let currentSteps = [];

        async function init() {
            // Set user email
            try {
                const user = await api.get('/auth/me');
                document.getElementById('user-email').innerText = user.email;
            } catch (e) { }

            if (videoId) {
                document.getElementById('workflow-visualization-view').classList.remove('hidden');
                document.getElementById('current-video-id').innerText = videoId;
                loadVideoDetails();
                loadWorkflow();
                setInterval(loadWorkflow, 2000);
            } else {
                document.getElementById('video-selection-view').classList.remove('hidden');
                loadVideoList();
            }
        }

        async function loadVideoDetails() {
            try {
                const video = await api.get(`/videos/${videoId}`);
                document.getElementById('current-video-name').innerText = video.filename.toUpperCase();
            } catch (error) {
                console.error('Error loading video details:', error);
            }
        }

        async function loadVideoList() {
            const container = document.getElementById('videos-grid');
            container.innerHTML = '<div class="col-span-full py-20 text-center opacity-50"><i class="fas fa-spinner fa-spin text-3xl mb-4"></i><p>Scanning Video Vault...</p></div>';

            try {
                const videos = await api.get('/videos/');
                if (videos.length === 0) {
                    container.innerHTML = '<div class="col-span-full py-20 text-center opacity-30"><i class="fas fa-film text-4xl mb-4"></i><p>No videos found. Upload some in Dashboard.</p></div>';
                    return;
                }

                container.innerHTML = videos.map(v => `
                    <div class="card p-6 rounded-2xl group hover:border-blue-500/30 transition-all cursor-pointer" onclick="window.location.href='workflow.html?video=${v.id}'">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl bg-blue-600/10 flex items-center justify-center text-blue-400 group-hover:bg-blue-600 group-hover:text-white transition-all">
                                <i class="fas fa-video"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <h4 class="text-white font-bold truncate">${v.filename}</h4>
                                <p class="text-[10px] text-slate-500 uppercase font-black tracking-widest mt-1">${v.status}</p>
                            </div>
                            <i class="fas fa-arrow-right text-slate-700 group-hover:text-blue-500 transition-all"></i>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading videos:', error);
                container.innerHTML = `<div class="col-span-full py-20 text-center text-red-500"><i class="fas fa-exclamation-triangle text-3xl mb-4"></i><p>Failed to load videos</p></div>`;
            }
        }

        async function loadWorkflow() {
            try {
                const data = await api.get(`/videos/${videoId}/workflow`);
                currentSteps = data.steps || [];
                renderWorkflow();
            } catch (error) {
                console.error('Error loading workflow:', error);
            }
        }

        function renderWorkflow() {
            const container = document.getElementById('workflowSteps');
            const html = currentSteps.map((step, index) => {
                const icon = STEP_ICONS[step.name] || 'cog';
                const label = STEP_LABELS[step.name] || step.name;
                const statusIcon = step.status === 'completed' ? '<i class="fas fa-check"></i>' :
                    step.status === 'active' ? '<i class="fas fa-spinner fa-spin"></i>' :
                        step.status === 'failed' ? '<i class="fas fa-times"></i>' : '<i class="fas fa-circle text-[6px]"></i>';

                const stepHtml = `
                    <div class="workflow-step">
                        <div class="step-node ${step.status}" onclick='showStepDetails(${JSON.stringify(step)})'>
                            <div class="step-status">${statusIcon}</div>
                            <i class="fas fa-${icon} step-icon"></i>
                        </div>
                        <div class="step-label">${label}</div>
                    </div>
                `;

                if (index < currentSteps.length - 1) {
                    const connectorClass = (step.status === 'completed' || step.status === 'active') ? 'active' : '';
                    return stepHtml + `<div class="step-connector ${connectorClass}"></div>`;
                }
                return stepHtml;
            }).join('');
            container.innerHTML = html;
        }

        function showStepDetails(step) {
            document.getElementById('detailTitle').textContent = STEP_LABELS[step.name] || step.name;
            document.getElementById('detailStatus').textContent = step.status.toUpperCase();

            let detailsHtml = `
                <div class="detail-field">
                    <label>Status</label>
                    <value>${step.status}</value>
                </div>
            `;

            if (step.started_at) {
                detailsHtml += `
                    <div class="detail-field">
                        <label>Started At</label>
                        <value>${new Date(step.started_at).toLocaleString()}</value>
                    </div>
                `;
            }

            if (step.completed_at) {
                detailsHtml += `
                    <div class="detail-field">
                        <label>Completed At</label>
                        <value>${new Date(step.completed_at).toLocaleString()}</value>
                    </div>
                `;
            }

            if (step.error) {
                detailsHtml += `
                    <div class="detail-field">
                        <label>Error</label>
                        <value style="color: #ef4444;">${step.error}</value>
                    </div>
                `;
            }

            if (step.details && Object.keys(step.details).length > 0) {
                detailsHtml += `
                    <div class="detail-field">
                        <label>Details</label>
                        <value><pre style="background: #0f172a; padding: 1rem; border-radius: 8px; overflow-x: auto; font-size: 10px; color: #94a3b8;">${JSON.stringify(step.details, null, 2)}</pre></value>
                    </div>
                `;
            }

            document.getElementById('detailBody').innerHTML = detailsHtml;
            document.getElementById('detailModal').classList.add('active');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        // Initialize
        init();
    </script>
</body>

</html>
